name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ruff
        run: pip install ruff

      - name: Ejecutar lint
        run: ruff check backend/

      - name: Verificar formato
        run: ruff format --check backend/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_tech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      - name: Aplicar migraciones
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/football_tech_test
          SECRET_KEY: test_secret_key_for_ci
          ENVIRONMENT: test
          LOG_LEVEL: ERROR
          OTLP_ENDPOINT: http://localhost:4317
        run: alembic upgrade head

      - name: Ejecutar tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/football_tech_test
          SECRET_KEY: test_secret_key_for_ci
          ENVIRONMENT: test
          LOG_LEVEL: ERROR
          OTLP_ENDPOINT: http://localhost:4317
        run: pytest tests/ -v --tb=short